version: '3.9'
services:
  api:
    image: akshola00/server:latest
    platform: linux/amd64
    restart: always
    environment:
      RPC_URL: "${RPC_URL}"
      PRIVATE_KEY: "${PRIVATE_KEY}"
      PUBLIC_KEY: "${PUBLIC_KEY}"
      CONTRACT_ADDRESS: "${CONTRACT_ADDRESS}"
      DATABASE_URL: "${DATABASE_URL}"
      CROWD_FUNDING_CONTRACT_ADDRESS: "${CROWD_FUNDING_CONTRACT_ADDRESS}"
      GENESIS_ADMIN_EMAIL: "${GENESIS_ADMIN_EMAIL}"
      GENESIS_ADMIN_PASSWORD: "${GENESIS_ADMIN_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRED_IN: "${JWT_EXPIRED_IN}"
      JWT_MAXAGE: "${JWT_MAXAGE}"
      REDIS_URL: "${REDIS_URL}"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
      - prometheus

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: "${DATABASE_URL_USER}"
      POSTGRES_PASSWORD: "${DATABASE_URL_PASSWORD}"
      POSTGRES_DB: "${DATABASE_URL_DB}"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9091:9090"
    command: --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "hosts.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports: 
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
    depends_on:
      - prometheus
      
volumes:
  pgdata:
